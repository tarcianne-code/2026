<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ValidaFácil</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="login-wrap"><form id="loginForm" class="panel login-card"><div class="logo">✓ ValidaFácil</div><h1>Bem-vindo</h1><p>Entre para consultar as validades.</p><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><p class="small">Acesso exclusivo do estabelecimento.</p></form></div>
<div id="app" hidden><aside><div class="logo">✓ ValidaFácil</div><nav><button data-page="home" class="nav active">⌂ Início</button><button data-page="products" class="nav">▦ Produtos e regras</button><button data-page="batches" class="nav">▤ Lotes e etiquetas</button></nav><div class="aside-bottom"><small id="email"></small><button id="logout" class="outline">Sair</button></div></aside><main><header><div><h1 id="pageTitle">Painel de validades</h1><p id="subtitle">Acompanhe os produtos todos os dias.</p></div><span id="date"></span></header><div id="content"></div></main></div>
<dialog id="modal"><form id="modalForm"><div class="modal-head"><h2 id="modalTitle"></h2><button type="button" id="closeModal" class="outline">✕</button></div><div id="fields"></div><footer><button type="button" class="outline" id="cancelModal">Cancelar</button><button type="submit">Salvar</button></footer></form></dialog><div id="toast" role="status"></div><script src="script.js"></script></body></html>
