<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Etiqueta 58 mm</title><style>
*{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:Arial,sans-serif;color:#111}.tools{padding:15px;text-align:center}.tools button{padding:12px 22px;background:#147654;color:#fff;border:0;border-radius:6px;cursor:pointer}.hint{font-size:12px;margin:10px auto;max-width:440px}.label{width:54mm;margin:15px auto;background:#fff;color:#111;font-family:Arial,sans-serif;box-shadow:0 3px 15px #0003;font-size:8pt;overflow:hidden}.bar{background:#171717;color:white;padding:2.5mm 1.5mm;font-weight:800}.brand{text-align:center;font-size:16pt;letter-spacing:-.5px}.content{padding:2mm 1.5mm}.line{margin:1.5mm 0;overflow-wrap:anywhere}.small{font-size:6.5pt}.expiry{font-size:9pt}.details{display:flex;gap:1mm;align-items:center}.info{flex:1;min-width:0}.qr{width:20mm;height:20mm;object-fit:contain;image-rendering:pixelated}.footer{text-align:center;font-size:6pt;line-height:1.25;padding:1.5mm}.error{color:#b42318;text-align:center}@page{size:58mm auto;margin:0}@media print{html,body{width:58mm;margin:0;padding:0;background:#fff}.tools{display:none}.label{margin:0;width:54mm;box-shadow:none;margin-left:2mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="tools"><button onclick="window.print()">Imprimir etiqueta</button><p class="hint">No diálogo de impressão, selecione a impressora térmica, papel de 58 mm, escala 100%, sem cabeçalhos/rodapés e margens mínimas. Faça um teste antes de imprimir em lote.</p></div><article id="label" class="label" hidden><div class="bar brand" id="brand">CHECKRÁPIDO</div><div class="content"><div class="line small" id="conservation"></div><div class="line small" id="prepared"></div></div><div class="bar expiry" id="expires"></div><div class="content details"><div class="info"><div class="line" id="quantity"></div><div class="line"><b id="lot"></b></div><div class="line" id="product"></div><div class="line" id="location"></div></div><img class="qr" id="qr" alt="QR Code de consulta"></div><div class="bar small" id="responsible"></div><div class="footer">ESCANEIE O QR CODE PARA CONSULTAR A VALIDADE</div></article><p class="error" id="error"></p><script>
const id=location.pathname.split('/').pop(),set=(x,v)=>document.getElementById(x).textContent=v;
const date=s=>{const [d,t]=s.split('T'),[y,m,day]=d.split('-');return `${day}/${m}/${y} ${t}`};
fetch('/api/batches/'+encodeURIComponent(id)).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.error||'Erro');set('conservation',b.conservation.toUpperCase());set('prepared','DATA DE MANIPULAÇÃO: '+date(b.prepared_at));set('expires','DATA DE VALIDADE: '+date(b.expires_at));set('quantity','PESO / QTD.: '+(b.quantity||'NÃO INFORMADO'));set('lot','LOTE: '+b.lot);set('product','PRODUTO: '+b.product_name.toUpperCase());set('location','LOCAL: '+b.location.toUpperCase());set('responsible','RESPONSÁVEL: '+b.responsible.toUpperCase());document.getElementById('qr').src='/api/batches/'+id+'/qr';document.getElementById('label').hidden=false}).catch(e=>set('error',e.message));
</script></body></html>
