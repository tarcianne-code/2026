<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CheckRápido</title><link rel="stylesheet" href="/static/style.css"></head><body><header><strong>CheckRápido </strong><button id="logout" hidden>Sair</button></header><main><section id="loginBox" class="card narrow"><h1>Entrar</h1><form id="login"><label>E-mail<input name="email" type="email" required></label><label>Senha<input name="password" type="password" required></label><button>Entrar</button></form></section><div id="app" hidden><h1>Controle de validade</h1><div class="columns"><section class="card"><h2>Cadastrar produto</h2><form id="productForm"><label>Nome do produto<input name="name" required maxlength="120"></label><label>Conservação<input name="conservation" value="Manter refrigerado (0°C a 4°C)" required></label><label>Local<input name="location" value="Cozinha" required></label><label>Validade após manipulação (horas)<input name="shelf_life_hours" type="number" min="1" max="87600" value="72" required></label><button>Salvar produto</button></form></section><section class="card"><h2>Novo lote / etiqueta</h2><form id="batchForm"><label>Produto<select name="product_id" id="productSelect" required></select></label><label>Código do lote<input name="lot" required placeholder="EX.: PAZ-2026-A1"></label><label>Data e hora de manipulação<input name="prepared_at" type="datetime-local" required></label><label>Peso ou quantidade<input name="quantity" placeholder="500 g"></label><label>Responsável<input name="responsible" required></label><button>Gerar etiqueta</button></form></section></div><section class="card"><h2>Lotes cadastrados</h2><div class="tableWrap"><table><thead><tr><th>Produto</th><th>Lote</th><th>Validade</th><th>Situação</th><th>Etiqueta</th></tr></thead><tbody id="batchRows"></tbody></table></div></section></div><p id="msg" role="status"></p></main><script src="/static/app.js"></script></body></html>
